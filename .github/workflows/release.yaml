name: release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'New release name (e.g. 1.0.0)'
        required: true

permissions:
  id-token: write # This is required for requesting the JWT token
  contents: read # This is required for actions/checkout

jobs:
  # bump sec-scanners-config

  create-tag:
    name: Create tag
    runs-on: ubuntu-latest
    environment: secrets
    env:
      RELEASE_NAME: ${{ github.event.inputs.name }}

    steps:
      - name: Validate release name format
        run: |
          if [[ ! "${RELEASE_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release name '${RELEASE_NAME}' does not match required format x.y.z"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }} # Checkout to latest branch changes

      - name: Create tag
        run: |
          git tag "${RELEASE_NAME}"
          git push origin "${RELEASE_NAME}"
  build:
    needs: create-tag
    uses: kyma-project/test-infra/.github/workflows/image-builder.yml@main
    with:
      name: dev-toolbox
      dockerfile: Dockerfile
      tags: "${{ github.sha }},${{ github.event.inputs.name }}"
