name: release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'New release name (e.g. 1.0.0)'
        required: true

permissions:
  id-token: write # This is required for requesting the JWT token
  contents: read # This is required for actions/checkout

jobs:
  # bump sec-scanners-config

  create-tag:
    name: Create tag
    runs-on: ubuntu-latest
    environment: secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }} # Checkout to latest branch changes

      - name: Validate release name
        env:
          NAME: ${{ github.event.inputs.name }}
        run: |
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release name: '$NAME'. Expected a semantic version like 1.2.3."
            exit 1
          fi
        shell: bash

      - name: Create tag
        env:
          NAME: ${{ github.event.inputs.name }}
        run: |
          git tag -f -- "$NAME"
          git push -f origin "refs/tags/$NAME"
        shell: bash
  build:
    needs: create-tag
    uses: kyma-project/test-infra/.github/workflows/image-builder.yml@main
    with:
      name: dev-toolbox
      dockerfile: Dockerfile
      tags: |
        ${{ github.sha }}
        ${{ github.event.inputs.name }}
